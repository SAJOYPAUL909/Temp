<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Local Code Diff</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #24292f;
            --border: #d0d7de;
            --add-bg: #e6ffec;
            --add-border: #ccffd8;
            --rem-bg: #ffebe9;
            --rem-border: #ffdce0;
            --empty-bg: #f6f8fa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f6f8fa;
            color: var(--text);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .inputs-container {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }

        .input-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        textarea {
            width: 100%;
            height: 250px;
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
            font-size: 13px;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            resize: vertical;
            box-sizing: border-box;
            white-space: pre;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: white;
            padding: 12px 20px;
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 15px;
            font-weight: 600;
            font-size: 14px;
        }

        .stats-group {
            display: flex;
            gap: 20px;
        }

        .stat-add { color: #1a7f37; }
        .stat-rem { color: #cf222e; }

        button {
            background-color: #2da44e;
            color: white;
            border: 1px solid rgba(27, 31, 36, 0.15);
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { background-color: #2c974b; }

        .diff-viewer {
            display: flex;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: white;
            overflow: hidden;
        }

        .diff-pane {
            width: 50%;
            display: flex;
            flex-direction: column;
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
            font-size: 13px;
        }

        .diff-pane.left { border-right: 1px solid var(--border); }

        .line {
            display: flex;
            min-height: 20px;
            line-height: 20px;
        }

        .line-num {
            width: 40px;
            min-width: 40px;
            padding: 0 10px;
            text-align: right;
            color: #6e7781;
            background-color: var(--empty-bg);
            border-right: 1px solid var(--border);
            user-select: none;
        }

        .line-code {
            padding: 0 10px;
            white-space: pre-wrap;
            word-break: break-all;
            flex: 1;
        }

        /* Diff Colors */
        .equal { background-color: var(--bg); }
        .add { background-color: var(--add-bg); }
        .add .line-num { background-color: var(--add-border); border-color: #4ac26b;}
        .remove { background-color: var(--rem-bg); }
        .remove .line-num { background-color: var(--rem-border); border-color: #ff8182;}
        .empty { background-color: var(--empty-bg); }
    </style>
</head>
<body>

    <div class="header">
        <h2>Offline Code Diff</h2>
        <button onclick="calculateDiff()">Compare Code</button>
    </div>

    <div class="inputs-container">
        <div class="input-box">
            <label><strong>Original Code</strong></label>
            <textarea id="oldText" placeholder="Paste old code here..." oninput="updateStats()"></textarea>
            <div id="oldStats" style="font-size: 12px; color: #6e7781;">Chars: 0 | Lines: 0</div>
        </div>
        <div class="input-box">
            <label><strong>Modified Code</strong></label>
            <textarea id="newText" placeholder="Paste new code here..." oninput="updateStats()"></textarea>
            <div id="newStats" style="font-size: 12px; color: #6e7781;">Chars: 0 | Lines: 0</div>
        </div>
    </div>

    <div class="stats-bar">
        <span>Comparison Results:</span>
        <div class="stats-group">
            <span class="stat-add" id="statAdded">+0 Additions</span>
            <span class="stat-rem" id="statRemoved">-0 Deletions</span>
        </div>
    </div>

    <div class="diff-viewer" id="diffViewer" style="display: none;">
        <div class="diff-pane left" id="leftPane"></div>
        <div class="diff-pane right" id="rightPane"></div>
    </div>

    <script>
        // Update character and line counts dynamically as the user types/pastes
        function updateStats() {
            const oldT = document.getElementById('oldText').value;
            const newT = document.getElementById('newText').value;
            
            document.getElementById('oldStats').innerText = `Chars: ${oldT.length} | Lines: ${oldT ? oldT.split('\n').length : 0}`;
            document.getElementById('newStats').innerText = `Chars: ${newT.length} | Lines: ${newT ? newT.split('\n').length : 0}`;
        }

        // Prevent HTML injection when displaying code
        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }

        // Core logic triggered by "Compare Code" button
        function calculateDiff() {
            const oldText = document.getElementById('oldText').value;
            const newText = document.getElementById('newText').value;

            const oldLines = oldText ? oldText.split('\n') : [];
            const newLines = newText ? newText.split('\n') : [];

            // Standard Longest Common Subsequence (LCS) matrix for line comparison
            const m = oldLines.length;
            const n = newLines.length;
            const dp = Array(m + 1).fill(null).map(() => Array(n + 1).fill(0));

            for (let i = 1; i <= m; i++) {
                for (let j = 1; j <= n; j++) {
                    if (oldLines[i - 1] === newLines[j - 1]) {
                        dp[i][j] = dp[i - 1][j - 1] + 1;
                    } else {
                        dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
                    }
                }
            }

            // Backtrack to find differences
            let i = m, j = n;
            const diff = [];
            let addedCount = 0;
            let removedCount = 0;

            while (i > 0 || j > 0) {
                if (i > 0 && j > 0 && oldLines[i - 1] === newLines[j - 1]) {
                    diff.unshift({ type: 'equal', oldLine: oldLines[i - 1], newLine: newLines[j - 1], oldNum: i, newNum: j });
                    i--; j--;
                } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
                    diff.unshift({ type: 'add', oldLine: null, newLine: newLines[j - 1], oldNum: null, newNum: j });
                    addedCount++; j--;
                } else if (i > 0 && (j === 0 || dp[i][j - 1] < dp[i - 1][j])) {
                    diff.unshift({ type: 'remove', oldLine: oldLines[i - 1], newLine: null, oldNum: i, newNum: null });
                    removedCount++; i--;
                }
            }

            // Update DOM with stats
            document.getElementById('statAdded').innerText = `+${addedCount} Additions`;
            document.getElementById('statRemoved').innerText = `-${removedCount} Deletions`;
            
            renderDiff(diff);
        }

        // Render the side-by-side UI
        function renderDiff(diff) {
            const leftPane = document.getElementById('leftPane');
            const rightPane = document.getElementById('rightPane');
            document.getElementById('diffViewer').style.display = 'flex';
            
            leftPane.innerHTML = '';
            rightPane.innerHTML = '';

            diff.forEach(item => {
                const leftDiv = document.createElement('div');
                const rightDiv = document.createElement('div');

                leftDiv.className = `line ${item.type === 'remove' ? 'remove' : item.type === 'equal' ? 'equal' : 'empty'}`;
                rightDiv.className = `line ${item.type === 'add' ? 'add' : item.type === 'equal' ? 'equal' : 'empty'}`;

                leftDiv.innerHTML = `
                    <div class="line-num">${item.oldNum || ''}</div>
                    <div class="line-code">${escapeHTML(item.oldLine)}</div>
                `;
                
                rightDiv.innerHTML = `
                    <div class="line-num">${item.newNum || ''}</div>
                    <div class="line-code">${escapeHTML(item.newLine)}</div>
                `;

                leftPane.appendChild(leftDiv);
                rightPane.appendChild(rightDiv);
            });
        }
    </script>
</body>
</html>
